services:
  bot-api:
    image: ${BOT_API_IMAGE:-aiogram/telegram-bot-api:latest}
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    # No published ports: this service is accessible only inside the Compose network.
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      BOT_API_BASE_URL: http://bot-api:8081
    volumes:
      - ./data:/data
    depends_on:
      - bot-api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-api-data:
