[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-restricted-content-bot"
version = "0.1.0"
description = "An allowlisted Telegram media downloader using a shared account"
requires-python = ">=3.12,<3.16"
dependencies = [
    "aiogram==3.32.0",
    "Telethon==1.45.0",
    "python-dotenv==1.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.5"]
heroku = ["psycopg[binary]==3.3.9"]

[project.scripts]
telegram-downloader = "telegram_downloader.main:cli"

[tool.setuptools.packages.find]
include = ["telegram_downloader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".bootstrap", ".uv-cache", ".venv", "build", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Fixture I/O is small and intentional; this timeout argument implements aiogram's API.
"tests/*" = ["ASYNC230", "ASYNC109"]
